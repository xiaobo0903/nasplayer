name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Show key errors
        if: failure()
        run: |
          echo "=== Duplicate class ==="; grep -n "Duplicate class" build.log | sort -u | head -40
          echo "=== Kotlin errors ===";  grep -n "^e: " build.log | head -40
          echo "=== What went wrong ==="; grep -n -A8 "What went wrong" build.log | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: NasPlayer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
